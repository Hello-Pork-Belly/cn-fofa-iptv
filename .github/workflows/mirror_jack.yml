name: Mirror and Optimize jackTV

on:
  schedule:
    - cron: '0 0,12 * * *' # Run every 12 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Mirror Script
        run: python mirror_jack.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add jack_mirror.m3u
          # Commit only if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update jackTV mirror with optimizations"
          git push
